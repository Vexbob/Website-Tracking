<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Sparziel-Tracker mit Wochenzielen, Achievements und Trophäen.">
<title>Sparziel-Tracker — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/reiter.js"></script>
<script src="/js/ring.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/ikon.js"></script>
<script src="/js/sw-update.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="/js/charts.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
<link rel="stylesheet" href="/sparziel/sparziel.css">
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Sparziel</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide sz">
    <!-- v2.19.0: drei Reiter statt vier. „Heute“ ist, weswegen man die Seite
         öffnet: das Ziel und das, was man diese Woche abhakt. Log und
         Trophäen sind beide ein Rückblick und stehen jetzt zusammen. -->
    <div class="tabs">
        <button id="tabHeute" class="tab-btn active" data-tab="heute">Heute</button>
        <button id="tabVerlauf" class="tab-btn" data-tab="verlauf">Verlauf</button>
        <button id="tabZiele" class="tab-btn" data-tab="ziele">Ziele</button>
    </div>

    <div id="tab-heute">
        <!-- Die Bühne: das aktive Ziel als Tank (Halbring, DESIGN 7a) mit der
             Heldenzahl in der Mulde. Ohne aktives Ziel zeigt sie den Puffer. -->
        <section class="v-buehne sz-buehne" id="heroBox">
            <div class="sz-b-haupt">
                <div class="sz-b-kopf">
                    <div class="sz-b-titel">
                        <span class="v-buehne-marke" id="szMarke">Sparziel</span>
                        <h1 class="sz-b-name" id="goalName"><span class="skel skel-line" style="width:9rem"></span></h1>
                    </div>
                    <button type="button" class="v-btn v-btn--ghost v-btn--icon sz-b-bearb" id="szBearbeiten"
                            onclick="dlgSparzielBearbeiten()" aria-label="Sparziel bearbeiten"><span data-ikon="stift"></span></button>
                </div>
                <div class="v-ring v-ring--halb v-ring--gut sz-b-ring" id="sgRing">
                    <svg viewBox="0 0 100 100" aria-hidden="true">
                        <circle class="v-ring-track" cx="50" cy="50" r="42"/>
                        <circle class="v-ring-fill" cx="50" cy="50" r="42"/>
                        <circle class="v-ring-over" cx="50" cy="50" r="42"/>
                    </svg>
                    <div class="v-ring-txt">
                        <strong class="v-held" id="stTotal"><span class="skel sz-held-skel"></span></strong>
                        <span class="sz-b-von" id="stTarget">&nbsp;</span>
                    </div>
                </div>
                <dl class="sz-b-fakten" id="szFakten">
                    <div><dt>Noch</dt><dd id="stMissing">–</dd></div>
                    <div><dt>Diese Woche</dt><dd id="stWoche">–</dd></div>
                    <div><dt>Im Puffer</dt><dd id="stPuffer">–</dd></div>
                </dl>
                <div class="sz-b-aktion" id="szAktion" hidden></div>
            </div>
            <div class="sz-b-kurve">
                <div class="sz-b-kurve-kopf"><span>Sparverlauf</span><span id="szKurveSub"></span></div>
                <div class="sz-b-kurve-flaeche"><canvas id="chartSavings" aria-label="Verlauf des Sparstands"></canvas></div>
            </div>
        </section>

        <div class="sz-heute-raster">
            <section class="v-abschnitt">
                <header class="v-abschnitt-kopf">
                    <h2>Wochenziele</h2>
                    <span class="v-abschnitt-sub" id="pgPeriodLbl"></span>
                    <button type="button" class="v-btn v-btn--ghost v-btn--sm" onclick="dlgNeuesWochenziel()"><span data-ikon="plus" data-ikon-gross="16"></span>Neu</button>
                </header>
                <div id="pgList" class="sz-gw-liste"><span class="skel sz-skel-kachel"></span><span class="skel sz-skel-kachel"></span></div>
            </section>

            <section class="v-abschnitt">
                <header class="v-abschnitt-kopf">
                    <h2>Achievements</h2>
                    <button type="button" class="v-btn v-btn--ghost v-btn--sm" onclick="dlgNeuesAchievement()"><span data-ikon="plus" data-ikon-gross="16"></span>Neu</button>
                </header>
                <div id="achGrid" class="sz-ms-liste"><span class="skel sz-skel-karte"></span><span class="skel sz-skel-karte"></span></div>
            </section>
        </div>
    </div>

    <div id="tab-verlauf" hidden>
        <section class="v-abschnitt" id="szTrophaeen">
            <header class="v-abschnitt-kopf">
                <h2>Trophäen</h2>
                <span class="v-abschnitt-sub" id="trophyStats"></span>
            </header>
            <div id="trophyGrid" class="sz-trophaeen"><span class="skel sz-skel-trophae"></span><span class="skel sz-skel-trophae"></span></div>
        </section>

        <section class="v-abschnitt">
            <header class="v-abschnitt-kopf">
                <h2>Chronik</h2>
                <span class="v-abschnitt-sub" id="logSum"></span>
            </header>
            <div class="sz-chronik-leiste">
                <label class="sz-suche">
                    <span data-ikon="lupe" data-ikon-gross="17"></span>
                    <input id="logSearch" type="search" placeholder="Suchen" aria-label="Chronik durchsuchen" autocomplete="off">
                </label>
                <div class="filter-popover-wrap">
                    <button type="button" class="filter-toggle-btn" id="logFilterBtn" aria-expanded="false" aria-haspopup="true">
                        <span data-ikon="filter" data-ikon-gross="16"></span><span id="logFilterLbl">Alle</span>
                    </button>
                    <div class="filter-popover sz-filter" id="logFilterPop" hidden>
                        <p class="fp-label">Art</p>
                        <div class="sz-filter-wahl" id="logFilterArten">
                            <button type="button" class="v-chip is-active" data-filter="all">Alle</button>
                            <button type="button" class="v-chip" data-filter="checkin">Check-ins</button>
                            <button type="button" class="v-chip" data-filter="milestone">Meilensteine</button>
                            <button type="button" class="v-chip" data-filter="progress">Fortschritt</button>
                            <button type="button" class="v-chip" data-filter="streak_bonus">Boni</button>
                            <button type="button" class="v-chip" data-filter="transfer">Überträge</button>
                            <button type="button" class="v-chip" data-filter="initial">Start</button>
                        </div>
                        <p class="fp-label">Gruppiert</p>
                        <div class="sz-filter-wahl" id="logFilterSicht">
                            <button type="button" class="v-chip is-active" data-view="weekly">Nach Woche</button>
                            <button type="button" class="v-chip" data-view="all">Nach Tag</button>
                        </div>
                    </div>
                </div>
            </div>
            <div id="logBody"><span class="skel sz-skel-zeile"></span><span class="skel sz-skel-zeile"></span><span class="skel sz-skel-zeile"></span></div>
            <button type="button" class="v-btn v-btn--ghost v-btn--sm sz-sicherung" onclick="downloadBackup()">
                <span data-ikon="herunter" data-ikon-gross="16"></span>Sicherung herunterladen
            </button>
        </section>
    </div>

    <div id="tab-ziele" hidden>
        <div class="sz-summe" id="ideenSummary"><span class="skel sz-skel-summe"></span><span class="skel sz-skel-summe"></span><span class="skel sz-skel-summe"></span></div>

        <section class="v-abschnitt">
            <header class="v-abschnitt-kopf">
                <h2>Sparziele</h2>
                <span class="v-abschnitt-sub">Eines wird bespart, die anderen ruhen mit ihrem Stand.</span>
                <button type="button" class="v-btn v-btn--ghost v-btn--sm" onclick="startNewGoal()"><span data-ikon="plus" data-ikon-gross="16"></span>Neu</button>
            </header>
            <div id="sgList" class="sz-ziele"><span class="skel sz-skel-ziel"></span><span class="skel sz-skel-ziel"></span></div>
            <div id="bufferBox"></div>
        </section>

        <section class="v-abschnitt">
            <header class="v-abschnitt-kopf">
                <h2>Wunschliste</h2>
                <button type="button" class="v-btn v-btn--ghost v-btn--sm" onclick="dlgNeuerWunsch()"><span data-ikon="plus" data-ikon-gross="16"></span>Neu</button>
            </header>
            <div id="potList"><span class="skel sz-skel-zeile"></span><span class="skel sz-skel-zeile"></span></div>
        </section>

        <section class="v-abschnitt">
            <header class="v-abschnitt-kopf">
                <h2>Ideen</h2>
                <button type="button" class="v-btn v-btn--ghost v-btn--sm" onclick="dlgNeueIdee()"><span data-ikon="plus" data-ikon-gross="16"></span>Neu</button>
            </header>
            <div id="ideaList"><span class="skel sz-skel-zeile"></span><span class="skel sz-skel-zeile"></span></div>
        </section>
    </div>
</main>

<div class="version-tag"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<canvas id="confettiCanvas" aria-hidden="true"></canvas>

<script src="/sparziel/sparziel.js"></script>
</body>
</html>
