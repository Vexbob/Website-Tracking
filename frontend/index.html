<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
    <title>Vexbob</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/config.js"></script>
    <script src="/js/version.js"></script>
    <script src="/js/api.js"></script>
</head>
<body style="visibility: hidden;">
    <nav class="navbar">
        <span class="nav-title">Vexbob</span>
        <div class="nav-right">
            <span class="nav-btn" id="userLabel" style="cursor:default"></span>
            <button class="nav-btn" id="themeBtn" title="Design umschalten">🌓</button>
            <button class="nav-btn" id="logoutBtn">Logout</button>
        </div>
    </nav>
    <main>
        <section class="section">
            <h2 style="margin-bottom:1rem">Tools</h2>
            <div class="tile-grid" id="tileGrid">
                <a href="/sparziel/" class="tile">
                    <div class="tile-icon green">€</div>
                    <div class="tile-text"><div class="tile-title">Sparziel-Tracker</div><div class="tile-sub">Achievements & Wochenziele</div></div>
                </a>
                <a href="/rezeptbuch/" class="tile">
                    <div class="tile-icon red">R</div>
                    <div class="tile-text"><div class="tile-title">Rezeptbuch</div><div class="tile-sub">Bald verfügbar</div></div>
                </a>
                <a href="/notizen/" class="tile">
                    <div class="tile-icon blue">N</div>
                    <div class="tile-text"><div class="tile-title">Notizen</div><div class="tile-sub">Bald verfügbar</div></div>
                </a>
                <a href="/photos/" class="tile">
                    <div class="tile-icon orange">P</div>
                    <div class="tile-text"><div class="tile-title">Photos</div><div class="tile-sub">Bald verfügbar</div></div>
                </a>
                <a href="/ausgaben/" class="tile">
                    <div class="tile-icon teal">€</div>
                    <div class="tile-text"><div class="tile-title">Ausgaben</div><div class="tile-sub">Kassenbons scannen &amp; analysieren</div></div>
                </a>
            </div>
        </section>
        <section class="section" id="adminSection" style="display:none">
            <h2 style="margin-bottom:1rem">Administration</h2>
            <div class="tile-grid">
                <a href="/admin/" class="tile">
                    <div class="tile-icon purple">A</div>
                    <div class="tile-text"><div class="tile-title">User-Verwaltung</div><div class="tile-sub">Accounts anlegen &amp; verwalten</div></div>
                </a>
            </div>
        </section>
    </main>
    <div class="version-tag"></div>
    <script>
        (async function() {
            if (!isLoggedIn()) { window.location.href = '/private/login.html'; return; }
            try {
                const me = await fetchMe(true);
                document.getElementById('userLabel').textContent = '👤 ' + me.username;
                if (me.is_admin) {
                    document.getElementById('adminSection').style.display = '';
                }
            } catch (e) { return; }
            document.body.style.visibility = 'visible';
            document.getElementById('logoutBtn').onclick = () => { clearToken(); location.reload(); };
            document.getElementById('themeBtn').onclick = toggleTheme;
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
        })();
    </script>
</body>
</html>
