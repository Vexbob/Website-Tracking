<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="description" content="Schnelle Notizen im Apple-Notes-Stil mit Suche und Farb-Tags.">
<title>Notizen — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/notizen/notizen.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    </head>
<body>
<nav class="navbar">
    <a href="/" class="nav-title">← Notizen</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn" title="Design umschalten" aria-label="Design umschalten">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<div class="nz-app" id="nzApp">
    <aside class="nz-sidebar">
        <div class="nz-side-head">
            <button class="nz-new" id="nzNew" title="Neue Notiz (Cmd/Ctrl+N)">
                <span class="ico">✎</span><span>Neue Notiz</span>
            </button>
            <div class="nz-search-wrap">
                <span class="nz-search-ico">🔍</span>
                <input type="search" id="nzSearch" placeholder="Suchen…">
            </div>
            <div class="nz-side-row">
                <select id="nzSort" title="Sortierung" class="nz-side-sort">
                    <option value="updated">Zuletzt geändert</option>
                    <option value="created">Erstellt</option>
                    <option value="title">Titel A-Z</option>
                </select>
            </div>
            <div class="nz-side-tabs">
                <button class="nz-side-tab active" data-scope="active">📋 Aktiv</button>
                <button class="nz-side-tab" data-scope="archived">🗄️ Archiv</button>
            </div>
        </div>
        <div class="nz-list" id="nzList"></div>
    </aside>
    <section class="nz-detail" id="nzDetail">
        <div class="nz-detail-empty" id="nzDetailEmpty">
            <div class="nz-de-illu">✎</div>
            <h3>Keine Notiz ausgewählt</h3>
            <div>Wähle links eine Notiz aus oder lege eine neue an.</div>
            <button class="nz-de-cta" id="nzDeCta" type="button">＋ Neue Notiz erstellen</button>
        </div>
        <div class="nz-detail-edit" id="nzDetailEdit" style="display:none">
            <div class="nz-d-head">
                <button class="nz-back" id="nzBack" type="button">← Liste</button>
                <input class="nz-d-title" id="nzDTitle" type="text" placeholder="Titel">
                <span class="nz-d-status" id="nzDStatus" title="Speicherstatus"><span class="dot"></span><span class="txt"></span></span>
            </div>
            <div class="nz-toolbar" id="nzToolbar">
                <button class="nz-tb" data-cmd="bold"      title="Fett (Cmd/Ctrl+B)"><b>B</b></button>
                <button class="nz-tb" data-cmd="italic"    title="Kursiv (Cmd/Ctrl+I)"><i>I</i></button>
                <button class="nz-tb" data-cmd="underline" title="Unterstrichen"><u>U</u></button>
                <button class="nz-tb" data-cmd="strike"    title="Durchgestrichen"><s>S</s></button>
                <button class="nz-tb" data-cmd="code"      title="Inline-Code"><code>{ }</code></button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="h1"        title="Überschrift 1">H1</button>
                <button class="nz-tb" data-cmd="h2"        title="Überschrift 2">H2</button>
                <button class="nz-tb" data-cmd="h3"        title="Überschrift 3">H3</button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="ul"        title="Aufzählung">• Liste</button>
                <button class="nz-tb" data-cmd="ol"        title="Nummerierung">1. Liste</button>
                <button class="nz-tb accent" data-cmd="task" title="Aufgabe (Cmd/Ctrl+Shift+7)">☐ Aufgabe</button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="quote"     title="Zitat">❝ Zitat</button>
                <button class="nz-tb" data-cmd="link"      title="Link (Cmd/Ctrl+K)">🔗 Link</button>
                <button class="nz-tb" data-cmd="hr"        title="Trennlinie">— HR</button>
            </div>
            <div class="nz-d-body">
                <div class="nz-editor" id="nzDEditor" contenteditable="true" spellcheck="true" data-placeholder="Schreib was… ✨"></div>
            </div>
            <div class="nz-detail-foot">
                <div class="nz-d-color" id="nzDColor"></div>
                <button class="nz-d-act" id="nzDPin" type="button">📍 Pin</button>
                <button class="nz-d-act" id="nzDArchive" type="button">🗄️ Archiv</button>
                <button class="nz-d-act danger" id="nzDDelete" type="button">🗑️ Löschen</button>
            </div>
        </div>
    </section>
</div>
<div class="version-tag"></div>
<script src="/notizen/notizen.js"></script>
</body>
</html>
