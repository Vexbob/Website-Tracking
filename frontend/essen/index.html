<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Essenstagebuch: hinschreiben, was es gab, und ob es normal oder übermäßig viel war. Mehr wird nicht gefragt.">
<title>Essenstagebuch — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/statistics.css">
<link rel="stylesheet" href="/essen/essen.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/ikon.js"></script>
<script src="/js/sw-update.js"></script>
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Essenstagebuch</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">

    <header class="page-head">
        <h1>🍽️ Essenstagebuch</h1>
    </header>

    <!-- Eine Seite, eine Aufgabe. Kein Reiter, kein Diagramm, keine
         Einstellungen: was hier zählt, ist die Strecke von „Seite offen“ bis
         „steht drin“. Wer Mengen und Nährwerte will, ist im anderen Modul. -->
    <div id="esFehler" hidden></div>

    <div id="esInhalt">
        <div class="stat-card">
            <div class="v-tagkopf">
                <button type="button" class="v-tagkopf-pfeil" id="esZurueck"
                        aria-label="Tag zurück">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5 8 12l6.5 7"/></svg>
                </button>
                <label class="v-tagkopf-mitte">
                    <span class="v-tagkopf-name" id="esTagName">Heute</span>
                    <span class="v-tagkopf-datum" id="esTagDatum"></span>
                    <input type="date" id="esDatumWahl" aria-label="Tag auswählen">
                </label>
                <button type="button" class="v-tagkopf-pfeil" id="esVor"
                        aria-label="Tag vor">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="2" stroke-linecap="round"
                         stroke-linejoin="round" aria-hidden="true"><path d="M9.5 5 16 12l-6.5 7"/></svg>
                </button>
                <button type="button" class="v-btn v-btn--primary v-tagkopf-aktion" id="esAdd">
                    <span aria-hidden="true">＋</span> Eintragen</button>
            </div>

            <!-- Der kürzeste Weg: was du oft isst, als Knopf. Ein Tipp trägt
                 ein — als „normal“, in die Mahlzeit, die zur Uhrzeit passt.
                 Das ist der Grund, warum diese Seite Freude macht, also steht
                 es über dem Tag und nicht darunter. -->
            <div class="es-schnell" id="esSchnell" hidden></div>

            <div id="esMahlzeiten"></div>

            <p class="es-fuss" id="esFuss"></p>
        </div>
    </div>

    <div class="version-tag"></div>
</main>

<!-- Am Handy liegt die Hauptaktion dort, wo der Daumen ohnehin ist. -->
<button type="button" class="v-fab" id="esFab">
    <span class="v-fab-plus" aria-hidden="true">＋</span> Eintragen</button>
<script src="/essen/essen.js"></script>
</body>
</html>
