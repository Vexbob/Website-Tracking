<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0c10">
    <meta name="description" content="User-Verwaltung für Vexbob-Administratoren.">
<title>Admin — Vexbob</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/config.js"></script>
    <script src="/js/version.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/modal.js"></script>
    <script src="/js/ikon.js"></script>
<script src="/js/nav-switcher.js"></script>
    <script src="/js/sw-update.js"></script>
    <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Verwaltung</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main>
    <header class="page-head">
        <h1>Accounts</h1>
        <p class="page-sub">Wer sich anmelden darf. Ein neuer Account legt sein Passwort über einen Einladungs-Link selbst fest.</p>
    </header>

    <!-- v2.11.7: Das Einladen lag als dauerhaft offene Maske ueber der Liste,
         um die es geht -- fuer einen Vorgang, den man ein paar Mal im Jahr
         hat. Was man selten tut, steht nicht dauerhaft auf der Seite
         (DESIGN 6d). Dazu stand der erklaerende Satz zweimal: einmal im
         Seitenkopf, vier Zeilen tiefer noch einmal in der Karte. -->
    <!-- v2.30.0: eine Zeile je Account; ein Tipp öffnet den Dialog mit
         Passwort, Einladungs-Link und -- einen Griff tiefer -- Löschen. Vorher
         standen bis zu drei Knöpfe an jeder Zeile, Löschen rot daneben. -->
    <section class="v-abschnitt ad-abschnitt">
        <header class="v-abschnitt-kopf">
            <h2>Accounts</h2>
            <span class="v-abschnitt-sub" id="userCount"></span>
            <button type="button" class="v-btn v-btn--sm v-btn--primary" id="inviteBtn"><span data-ikon="plus" data-ikon-gross="16"></span>Einladen</button>
        </header>
        <div id="userList">
            <span class="skel skel-line long"></span>
            <span class="skel skel-line"></span>
        </div>
    </section>
</main>

<div class="version-tag"></div>
<div id="toast" class="toast"></div>

<script>
let users = [];
let toastTimer = null;

function showToast(m, err) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.toggle('err', !!err);
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(d) {
    if (!d) return '';
    try { return new Date(d).toLocaleDateString('de-DE', {day:'2-digit',month:'2-digit',year:'numeric'}); }
    catch(e) { return d; }
}

function inviteUrl(token) {
    return `${location.origin}/private/activate.html?t=${token}`;
}

async function loadUsers() {
    try {
        users = await apiCall('/api/admin/users') || [];
        renderUsers();
    } catch(e) {
        showToast(e.message || 'Fehler beim Laden', true);
        document.getElementById('userList').innerHTML = '<div class="muted">Laden fehlgeschlagen.</div>';
    }
}

function renderUsers() {
    const box = document.getElementById('userList');
    document.getElementById('userCount').textContent = users.length ? users.length + (users.length === 1 ? ' Account' : ' Accounts') : '';
    if (!users.length) { box.innerHTML = '<div class="empty"><p class="empty-text">Noch kein Account außer dir. Lade jemanden ein.</p></div>'; return; }
    box.innerHTML = '<div class="rec-list">' + users.map(u => {
        const status = u.is_admin ? '<span class="v-tag">Admin</span>'
            : (!u.activated ? '<span class="v-tag v-tag--warn">nicht aktiviert</span>' : '');
        return `<button type="button" class="rec-row" onclick="dlgUser(${u.id})">
            <span class="rec-mark ad-mark" aria-hidden="true">${esc((u.username || '?').slice(0, 1).toUpperCase())}</span>
            <span class="rec-main"><span class="rec-title">${esc(u.username)} ${status}</span>
                <span class="rec-meta">seit ${fmtDate(u.created_at)}</span></span>
            <span class="rec-go">${window.VexIkon ? VexIkon.svg('pfeil', 16) : ''}</span>
        </button>`;
    }).join('') + '</div>';
}

/* Alles zu einem Account an einer Stelle. Löschen steht im Fuß, links und
   leise -- die zerstörendste Aktion der Anwendung gehört nicht als roter
   Knopf an jede Zeile (CLAUDE.md, „Löschen ist kein Knopf in einer Liste“). */
function dlgUser(id) {
    const u = users.find(x => x.id === id);
    if (!u) return;
    const status = u.is_admin ? 'Administrator' : (u.activated ? 'Aktiv' : 'Noch nicht aktiviert');
    const knoepfe = [];
    if (!u.activated && u.pending_token) {
        knoepfe.push('<button type="button" class="v-btn v-btn--primary" data-link>Einladungs-Link anzeigen</button>');
        knoepfe.push('<button type="button" class="v-btn" data-neu>Neuen Link erzeugen</button>');
    } else if (!u.activated) {
        knoepfe.push('<button type="button" class="v-btn v-btn--primary" data-neu>Einladungs-Link erzeugen</button>');
    } else {
        knoepfe.push('<button type="button" class="v-btn" data-pw>Passwort zurücksetzen</button>');
    }
    const d = VexModal.open(esc(u.username), `
        <p class="ad-dlg-note">${status} · seit ${fmtDate(u.created_at)}</p>
        <div class="ad-knoepfe">${knoepfe.join('')}</div>
        <div class="modal-fuss">
            ${u.is_admin ? '<span></span>' : '<button type="button" class="v-btn v-btn--danger" data-weg>Löschen</button>'}
            <button type="button" class="v-btn" data-zu>Schließen</button>
        </div>`, {});
    const an = (sel, fn) => { const el = d.root.querySelector(sel); if (el) el.onclick = fn; };
    an('[data-zu]', () => d.close());
    an('[data-link]', () => { d.close(); showInvite(u.pending_token, u.username, u.pending_expires); });
    an('[data-neu]', () => { d.close(); regenerateInvite(u.id, u.username); });
    an('[data-pw]', () => { d.close(); openPwModal(u.id, u.username); });
    an('[data-weg]', async () => { if (await deleteUser(u.id, u.username)) d.close(); });
}

function openInviteDialog() {
    const dlg = VexModal.open('Neuen Account einladen',
        '<p class="ad-dlg-note">Du erstellst den Account, der Benutzer bekommt einen '
        + 'einmaligen Einladungs-Link und legt sein Passwort selbst fest.</p>'
        + '<label for="newUsername">Benutzername</label>'
        + '<input id="newUsername" placeholder="z.B. Anna" autocomplete="off">'
        + '<div class="modal-fuss"><button type="button" class="v-btn" data-zu>Abbrechen</button>'
        + '<button type="button" class="v-btn v-btn--primary" id="inviteGo">Einladung erstellen</button></div>',
        { voll: true });
    dlg.root.querySelector('[data-zu]').onclick = () => dlg.close();
    dlg.root.querySelector('#inviteGo').onclick = async () => {
        if (await createUser()) dlg.close();
    };
    // Nur am Rechner ins Feld springen -- am Handy risse das die Tastatur
    // ueber den Dialog, den man gerade liest.
    if (window.matchMedia('(min-width: 721px)').matches) {
        dlg.root.querySelector('#newUsername').focus();
    }
}

/* Gibt zurueck, ob es geklappt hat -- der Dialog schliesst nur dann. Bleibt
   er bei einem Fehler offen, steht der getippte Name noch da. */
async function createUser() {
    const feld = document.getElementById('newUsername');
    const uname = feld ? feld.value.trim() : '';
    if (!uname || uname.length < 2) { showToast('Username zu kurz', true); return false; }
    try {
        const res = await apiCall('/api/admin/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: uname })
        });
        haptic('success');
        await loadUsers();
        showInvite(res.invite_token, res.username, res.invite_expires_at);
        return true;
    } catch(e) {
        haptic('error');
        showToast(e.message || 'Fehler', true);
        return false;
    }
}

async function regenerateInvite(id, name) {
    try {
        const res = await apiCall('/api/admin/users/' + id + '/regenerate-invite', { method: 'POST' });
        showInvite(res.invite_token, name, res.invite_expires_at);
        await loadUsers();
    } catch(e) {
        showToast(e.message || 'Fehler', true);
    }
}

function showInvite(token, name, expiresAt) {
    const exp = new Date(expiresAt);
    const days = Math.round((exp - Date.now()) / (1000 * 60 * 60 * 24));
    const link = inviteUrl(token);
    const d = VexModal.open('Einladungs-Link', `
        <p class="ad-dlg-note">Schicke diesen Link an <strong>${esc(name)}</strong>. Er gilt einmal,
            bis ${esc(exp.toLocaleDateString('de-DE', { day: '2-digit', month: 'short', year: 'numeric' }))} (${days} Tage).</p>
        <div class="invite-box">${esc(link)}</div>
        <div class="modal-fuss">
            <button type="button" class="v-btn" data-zu>Schließen</button>
            <button type="button" class="v-btn v-btn--primary" data-kopie>Kopieren</button>
        </div>`, {});
    d.root.querySelector('[data-zu]').onclick = () => d.close();
    d.root.querySelector('[data-kopie]').onclick = async () => {
        try {
            await navigator.clipboard.writeText(link);
            haptic('tap');
            showToast('Link kopiert');
        } catch (e) {
            showToast('Kopieren fehlgeschlagen — bitte manuell markieren', true);
        }
    };
}

function openPwModal(id, name) {
    const d = VexModal.open('Passwort zurücksetzen', `
        <p class="ad-dlg-note">Für <strong>${esc(name)}</strong>. Nur nutzen, wenn das Passwort verloren ist.</p>
        <label for="pwModalInput">Neues Passwort (mindestens 6 Zeichen)</label>
        <input id="pwModalInput" type="password" autocomplete="new-password">
        <div class="modal-fuss">
            <button type="button" class="v-btn" data-zu>Abbrechen</button>
            <button type="button" class="v-btn v-btn--primary" data-ok>Speichern</button>
        </div>`, { voll: true });
    d.root.querySelector('[data-zu]').onclick = () => d.close();
    d.root.querySelector('[data-ok]').onclick = async () => {
        const pw = d.root.querySelector('#pwModalInput').value;
        if (!pw || pw.length < 6) { showToast('Mindestens 6 Zeichen', true); return; }
        try {
            await apiCall('/api/admin/users/' + id + '/password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw })
            });
            d.close();
            haptic('success');
            showToast('Passwort geändert');
        } catch (e) {
            haptic('error');
            showToast(e.message || 'Fehler', true);
        }
    };
    if (window.matchMedia('(min-width: 721px)').matches) d.root.querySelector('#pwModalInput').focus();
}

async function deleteUser(id, name) {
    // Der gestaltete Dialog, nicht der native: das hier ist die
    // zerstoerendste Aktion der ganzen Anwendung, und ausgerechnet sie
    // stellte die Frage in einem Kasten, der aus der Seite ausbricht und
    // dessen Knopf „OK“ heisst.
    const ok = await askConfirm({
        title: `Account „${name}“ löschen?`,
        text: 'Alle Daten dieses Kontos werden unwiderruflich entfernt — '
            + 'Bons, Notizen, Sparziele, Gesundheitsdaten. Das lässt sich nicht rückgängig machen.',
        ok: 'Endgültig löschen', danger: true });
    if (!ok) return false;
    try {
        await apiCall('/api/admin/users/' + id, { method: 'DELETE' });
        haptic('success');
        showToast('Gelöscht');
        await loadUsers();
        return true;
    } catch(e) {
        haptic('error');
        showToast(e.message || 'Fehler', true);
        return false;
    }
}

document.getElementById('logoutBtn').onclick = () => { clearToken(); location.href = '/private/login.html'; };
document.getElementById('inviteBtn').onclick = openInviteDialog;

(async function boot() {
    if (!isLoggedIn()) { location.href = '/private/login.html'; return; }
    // Aufdecken direkt hinter dem synchronen Login-Check. Vorher hing die
    // Freigabe hinter `await fetchMe()`, und der `catch`-Zweig kehrte ohne
    // sie zurueck: bei einem Serverfehler blieb eine leere Seite ohne
    // Meldung stehen.
    document.body.classList.add('ready');
    try {
        const me = await fetchMe(true);
        if (!me.is_admin) {
            await askAlert({ title: 'Kein Zugriff',
                             text: 'Diese Seite ist Administratoren vorbehalten.' });
            location.href = '/';
            return;
        }
        document.getElementById('userLabel').textContent = me.username;
    } catch(e) {
        await askAlert({ title: 'Laden fehlgeschlagen',
                         text: (e && e.message) ? e.message : 'Der Server antwortet nicht.' });
        return;
    }
    await loadUsers();
})();
</script>
</body>
</html>
