<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ernährung — umgezogen</title>
<!-- Das Ernaehrungs-Modul ist in v1.98.0 in zwei geteilt worden:
       /essen/       Essenstagebuch  — was gab es, normal oder uebermaessig
       /naehrwerte/  Tracker         — Mengen, Naehrwerte, Tagesziele
     Diese Seite bleibt als Wegweiser stehen, damit ein Lesezeichen nicht ins
     Leere laeuft. Sie fuehrt zum Tagebuch: das ist die Seite, die man
     taeglich oeffnet. -->
<meta http-equiv="refresh" content="0; url=/essen/">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main>
    <div class="v-card" style="max-width:34rem;margin:15vh auto 0">
        <div class="v-card-head"><h3>Umgezogen</h3></div>
        <p style="color:var(--text-2);line-height:1.6">
            Die Ernährung ist jetzt zwei Module:
            <strong>🍽️ Essenstagebuch</strong> für „was gab es, normal oder übermäßig“
            und <strong>📊 Nährwerte</strong> für Mengen, Nährwerte und Tagesziele.
        </p>
        <p style="color:var(--text-3);font-size:0.875rem">
            Du wirst zum Tagebuch weitergeleitet.
        </p>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem">
            <a class="v-btn v-btn--primary" href="/essen/" style="width:auto">Zum Essenstagebuch</a>
            <a class="v-btn" href="/naehrwerte/" style="width:auto">Zu den Nährwerten</a>
        </div>
    </div>
</main>
</body>
</html>
