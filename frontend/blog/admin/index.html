<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Blog-Admin — Vexbob</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/notizen/notizen.css">
<link rel="stylesheet" href="/blog/admin/admin.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
</head>
<body style="visibility:hidden">
<nav class="navbar">
    <a href="/" class="nav-title">← Blog-Admin</a>
    <div class="nav-right">
        <a class="nav-btn" href="/blog/" target="_blank">📰 Live-Ansicht</a>
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn" title="Design umschalten">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<div class="ba-app">
    <aside class="ba-sidebar">
        <button class="ba-new" id="baNew">＋ Neuer Post</button>
        <div class="ba-list" id="baList"></div>
    </aside>
    <section class="ba-editor" id="baEditor">
        <div class="ba-empty" id="baEmpty">
            <div style="font-size:3rem;opacity:0.35">✎</div>
            <h3>Kein Post ausgewählt</h3>
            <div>Wähle links einen aus oder leg einen neuen an.</div>
        </div>
        <div class="ba-detail" id="baDetail" style="display:none">
            <div class="ba-head">
                <input class="ba-title" id="baTitle" placeholder="Titel des Beitrags">
                <span class="nz-d-status" id="baStatus"><span class="dot"></span><span class="txt"></span></span>
            </div>
            <input class="ba-subtitle" id="baSubtitle" placeholder="Untertitel (optional)">
            <div class="ba-meta-row">
                <label>Slug <input class="ba-slug" id="baSlug" placeholder="auto"></label>
                <label>Cover-URL <input class="ba-cover" id="baCover" placeholder="https://…"></label>
                <label>Tags <input class="ba-tags" id="baTags" placeholder="tag1, tag2"></label>
            </div>
            <div class="nz-toolbar" id="baToolbar">
                <button class="nz-tb" data-cmd="bold"><b>B</b></button>
                <button class="nz-tb" data-cmd="italic"><i>I</i></button>
                <button class="nz-tb" data-cmd="underline"><u>U</u></button>
                <button class="nz-tb" data-cmd="code"><code>{ }</code></button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="h1">H1</button>
                <button class="nz-tb" data-cmd="h2">H2</button>
                <button class="nz-tb" data-cmd="h3">H3</button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="ul">• Liste</button>
                <button class="nz-tb" data-cmd="ol">1. Liste</button>
                <button class="nz-tb accent" data-cmd="task">☐ Aufgabe</button>
                <span class="nz-tb-sep"></span>
                <button class="nz-tb" data-cmd="quote">❝ Zitat</button>
                <button class="nz-tb" data-cmd="link">🔗 Link</button>
                <button class="nz-tb" data-cmd="hr">— HR</button>
            </div>
            <div class="nz-d-body">
                <div class="nz-editor" id="baContent" contenteditable="true" spellcheck="true" data-placeholder="Inhalt … Markdown-Shortcuts (# ## ### - > 1. - [ ]) und Cmd/Ctrl+B/I funktionieren."></div>
            </div>
            <div class="ba-foot">
                <div class="ba-state" id="baState">Entwurf</div>
                <button class="ba-btn ba-publish" id="baPublish">Veröffentlichen</button>
                <button class="ba-btn ba-unpub" id="baUnpub" style="display:none">Zurückziehen</button>
                <button class="ba-btn ba-del" id="baDelete">🗑️ Löschen</button>
            </div>
        </div>
    </section>
</div>
<div class="version-tag"></div>
<script src="/blog/admin/admin.js" defer></script>
</body>
</html>
