<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Preisverlauf — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{visibility:hidden}body.ready{visibility:visible}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:1rem;box-shadow:var(--shadow-sm)}
.card h3{font-size:1rem;margin-bottom:0.5rem;font-weight:600}
.pv-search{display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.pv-search input{flex:1;min-width:180px;margin:0}
.pv-toolbar-toggle{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pv-toolbar-toggle button{background:var(--surface);border:none;color:var(--text-muted);padding:0.4rem 0.75rem;font-size:0.75rem;font-weight:600;cursor:pointer;width:auto;margin:0;border-radius:0}
.pv-toolbar-toggle button.active{background:var(--teal);color:#fff}
/* Grid mit Kacheln (v1.16.0) */
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0.75rem}
.pv-tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0.875rem;cursor:pointer;transition:border-color .15s,transform .1s,box-shadow .15s;display:flex;flex-direction:column;gap:0.5rem;position:relative;overflow:hidden}
.pv-tile:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.pv-tile.up{border-left:3px solid #ef4444}
.pv-tile.down{border-left:3px solid #22c55e}
.pv-tile-head{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem}
.pv-tile-title{font-weight:700;font-size:0.9375rem;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pv-tile-brand{display:inline-block;font-size:0.625rem;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pv-tile-brand.private{background:#dbeafe;color:#1e40af;border-color:transparent}
:root[data-theme="dark"] .pv-tile-brand.private{background:#1e3a8a;color:#93c5fd}
.pv-tile-price{font-weight:800;font-size:1.375rem;color:var(--text);font-variant-numeric:tabular-nums;line-height:1}
.pv-tile-price-sub{font-size:0.6875rem;color:var(--text-faint);font-weight:500;margin-top:2px}
.pv-tile-meta{display:flex;flex-wrap:wrap;gap:0.375rem 0.625rem;font-size:0.6875rem;color:var(--text-muted);align-items:center}
.pv-tile-meta .dot{opacity:0.4}
.pv-tile-chart{height:56px;position:relative;margin-top:0.25rem}
.pv-tile-chart svg{width:100%;height:100%;display:block}
.pv-tile-change{position:absolute;top:0.5rem;right:0.5rem;font-size:0.6875rem;font-weight:800;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-tile-change.up{background:#fee2e2;color:#991b1b}
.pv-tile-change.down{background:#dcfce7;color:#166534}
:root[data-theme="dark"] .pv-tile-change.up{background:#7f1d1d;color:#fca5a5}
:root[data-theme="dark"] .pv-tile-change.down{background:#14532d;color:#4ade80}
.pv-tile-cheap-hint{font-size:0.6875rem;color:var(--green-dark);font-weight:600;margin-top:0.125rem}
/* Kompakte Listenansicht (Alt-Ansicht als Fallback) */
.pv-list{display:flex;flex-direction:column;gap:0.5rem}
.pv-item{display:grid;grid-template-columns:1fr auto auto;gap:0.75rem;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.75rem 0.875rem;cursor:pointer;transition:border-color .15s,background .15s}
.pv-item:hover{border-color:var(--border-strong);background:var(--surface-2)}
.pv-item.up{border-left:3px solid #ef4444}
.pv-item.down{border-left:3px solid #22c55e}
.pv-name{font-weight:600;font-size:0.9375rem;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-sub{font-size:0.75rem;color:var(--text-muted);margin-top:2px;display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center}
.pv-sub .dot{opacity:0.5}
.pv-price-col{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:1px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pv-price{font-weight:700;font-size:1rem;color:var(--text)}
.pv-price-sub{font-size:0.6875rem;color:var(--text-faint)}
.pv-change{font-size:0.75rem;font-weight:700;padding:2px 6px;border-radius:5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-change.up{background:#fee2e2;color:#991b1b}
.pv-change.down{background:#dcfce7;color:#166534}
.pv-change.flat{color:var(--text-faint);background:transparent;font-weight:500}
:root[data-theme="dark"] .pv-change.up{background:#7f1d1d;color:#fca5a5}
:root[data-theme="dark"] .pv-change.down{background:#14532d;color:#4ade80}
.pv-empty{text-align:center;color:var(--text-faint);padding:2rem 1rem;font-size:0.875rem}
.pv-empty .icon{font-size:2.5rem;opacity:0.5;margin-bottom:0.5rem}
/* Chart-Modal + Preisvergleich zweigeteilt (v1.16.0) */
.pv-tabs{display:flex;gap:0;margin-bottom:0.75rem;border-bottom:2px solid var(--border)}
.pv-tab-btn{background:transparent;border:none;padding:0.5rem 0.875rem;font-size:0.8125rem;font-weight:600;cursor:pointer;color:var(--text-faint);border-bottom:3px solid transparent;margin-bottom:-2px;width:auto;border-radius:0}
.pv-tab-btn.active{color:var(--text);border-bottom-color:var(--teal)}
.pv-tab-panel{display:none}
.pv-tab-panel.active{display:block}
.pv-chart-wrap{position:relative;height:220px;margin-bottom:0.75rem}
.pv-hist-list{display:flex;flex-direction:column;gap:0.25rem;font-size:0.8125rem;margin-top:0.5rem}
.pv-hist-item{display:grid;grid-template-columns:auto 1fr auto auto;gap:0.5rem;padding:0.5rem 0.625rem;background:var(--surface-2);border-radius:8px;align-items:center;border:1px solid transparent}
.pv-hist-item:hover{border-color:var(--border)}
.pv-hist-item.solo{opacity:0.65;border-style:dashed;border-color:var(--border-strong)}
.pv-hist-date{color:var(--text-muted);font-size:0.75rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pv-hist-body{overflow:hidden;min-width:0}
.pv-hist-desc{font-size:0.8125rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.pv-hist-store{font-size:0.6875rem;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.pv-hist-price{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:0.875rem}
.pv-hist-price.reduced{color:var(--green-dark)}
.pv-hist-actions{display:flex;gap:0.25rem}
.pv-hist-actions a,.pv-hist-actions button{width:26px;height:26px;padding:0;margin:0;font-size:0.8125rem;background:transparent;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.pv-hist-actions a:hover{border-color:var(--teal);color:var(--teal-dark);text-decoration:none}
.pv-hist-actions button:hover{border-color:var(--orange);color:var(--orange-dark,#c2410c)}
.pv-hist-actions .exclude:hover{border-color:var(--red);color:var(--red-dark)}
.pv-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;margin-bottom:0.75rem}
@media(max-width:500px){.pv-summary-grid{grid-template-columns:1fr}}
.pv-summary-card{padding:0.625rem 0.75rem;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.pv-summary-card.cheap{border-left:3px solid var(--green)}
.pv-summary-card.expensive{border-left:3px solid var(--red)}
.pv-summary-lbl{font-size:0.6875rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px}
.pv-summary-store{font-weight:600;font-size:0.9375rem;margin:2px 0}
.pv-summary-val{font-weight:700;font-size:0.9375rem;color:var(--text);font-variant-numeric:tabular-nums}
.pv-summary-sub{font-size:0.6875rem;color:var(--text-faint);font-weight:500;margin-left:0.375rem}
.reparse-progress{display:flex;flex-direction:column;gap:0.5rem}
.reparse-bar-wrap{background:var(--surface-2);border-radius:8px;overflow:hidden;height:14px;border:1px solid var(--border)}
.reparse-bar{background:var(--teal);height:100%;width:0;transition:width .2s ease-out;border-radius:8px}
.reparse-log{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:0.5rem 0.75rem;max-height:180px;overflow:auto;font-family:ui-monospace,monospace;font-size:0.75rem;color:var(--text-muted);white-space:pre-line}
.reparse-log .ok{color:var(--green-dark)}
.reparse-log .err{color:var(--red-dark)}
.ausg-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--surface);padding:0.75rem 1.25rem;border-radius:10px;font-size:0.875rem;font-weight:500;z-index:1000;opacity:0;transition:transform .25s,opacity .25s;box-shadow:var(--shadow-lg);pointer-events:none}
.ausg-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<nav class="navbar">
    <a href="/ausgaben/" class="nav-title">← Preisverlauf</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div id="subnav" data-active="preisverlauf"></div>
    <div class="card">
        <div class="pv-search">
            <input id="pvSearch" placeholder="🔍 Produkt suchen …">
            <div class="pv-toolbar-toggle" title="Ansicht wechseln">
                <button data-view="grid" class="active" title="Kachel-Ansicht mit Mini-Chart">▦ Kacheln</button>
                <button data-view="list" title="Kompakte Liste">☰ Liste</button>
            </div>
            <button id="pvReparse" style="width:auto;margin:0;background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:0.5rem 0.75rem;font-size:0.8125rem;white-space:nowrap" title="Alle Bons mit Foto neu von der KI parsen (aktualisiert Beschreibungen, Kategorien, Einheiten)">🔄 Alle neu parsen</button>
        </div>
        <div style="font-size:0.75rem;color:var(--text-faint);margin-bottom:0.75rem">Zeigt nur Produkte, die mind. 2× gekauft oder einer Marke zugeordnet sind (v1.16.0).</div>
        <div id="pvList"></div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/preisverlauf.js"></script>
</body>
</html>
