<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Marken — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/ausgaben/ausgaben.js"></script>
<style>
body{visibility:hidden}body.ready{visibility:visible}
/* Ruhende Flaeche: Ebene + Haarlinie, kein Schatten (docs/DESIGN.md). */
.card{background:var(--surface-1);border:1px solid var(--line);border-radius:var(--radius-lg);padding:1.25rem;margin-bottom:1rem}
.brand-toolbar{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;margin-bottom:0.75rem}
.brand-toolbar input,.brand-toolbar select{margin:0;padding:0.5rem 0.625rem;font-size:0.875rem}
.brand-toolbar input.search{flex:1;min-width:180px}
.brand-toolbar .filter-chip{padding:0.375rem 0.75rem;font-size:0.75rem;border:1px solid var(--line);border-radius:16px;background:var(--surface-2);color:var(--text-2);cursor:pointer;width:auto;font-weight:600;margin:0}
.brand-toolbar .filter-chip.active{background:var(--accent-strong);color:var(--accent-ink);border-color:var(--accent-strong)}
.add-form{display:grid;grid-template-columns:1fr 1fr auto;gap:0.5rem;align-items:center;margin-top:0.75rem}
@media(max-width:600px){.add-form{grid-template-columns:1fr}}
.add-form input,.add-form select,.add-form button{margin:0;padding:0.5rem 0.625rem;font-size:0.875rem}
.add-form button.primary{background:var(--grad-accent);color:var(--accent-ink);width:auto;padding:0.5rem 1rem}
.brand-list{display:flex;flex-direction:column;gap:0.375rem;margin-top:0.75rem;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);padding:0.5rem}
.brand-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:0.5rem;align-items:center;padding:0.5rem 0.625rem;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius)}
.brand-name{font-weight:600;font-size:0.875rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand-meta{font-size:0.6875rem;color:var(--text-3);margin-top:1px;display:flex;gap:0.375rem;align-items:center;flex-wrap:wrap}
.brand-badge{padding:1px 6px;border-radius:6px;font-size:0.625rem;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.brand-badge.private{background:var(--info-soft);color:var(--info)}
.brand-badge.parent{background:var(--surface-3);color:var(--text-2)}
.brand-row select.store{padding:0.3rem 0.5rem;font-size:0.75rem;margin:0;min-width:0;max-width:min(15rem,40vw);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;color:var(--text-1)}
.brand-row button.del{background:transparent;border:1px solid transparent;border-radius:6px;color:var(--text-3);cursor:pointer;padding:0.25rem 0.4rem;width:auto;margin:0;font-size:0.9375rem}
.brand-row button.del:hover{color:var(--danger);background:var(--danger-soft)}
.brand-row.system{opacity:0.85}
.brand-count{color:var(--text-3);font-size:0.75rem;font-weight:500;margin-bottom:0.5rem}
.brand-purchases{padding:1px 6px;border-radius:999px;font-size:0.6875rem;font-weight:700;background:var(--surface-3);color:var(--text-2)}
.brand-purchases.muted{background:var(--surface-2);color:var(--text-3);border:1px solid var(--line)}
</style>
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Marken</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main>
<div id="subnav" data-active="marken"></div>

    <header class="page-head">
        <h1>Marken</h1>
        <p class="page-sub">Wer den Artikel herstellt. Eine Marke, die an einem Laden hängt,
        ist dessen <strong>Eigenmarke</strong> — daran erkennst du später, wie viel vom
        Einkauf aus der günstigen Hausmarke bestand.</p>
    </header>

    <div class="card">
        <h3 style="margin-bottom:0.5rem">Neue Marke hinzufügen</h3>
        <div class="add-form">
            <input type="text" id="newName" placeholder="Markenname z.B. Milbona, Milka, Nutella">
            <select id="newStore">
                <option value="">– Hersteller-Marke (kein Laden) –</option>
            </select>
            <button id="newBtn" class="primary">Hinzufügen</button>
        </div>
        <div style="margin-top:0.5rem;font-size:0.75rem;color:var(--text-faint)">Mit Laden verknüpfen = <strong>Eigenmarke</strong>, sonst Hersteller-Marke.</div>
    </div>
    <div class="card">
        <h3>Meine Marken</h3>
        <div class="brand-toolbar">
            <input type="search" class="search" id="q" placeholder="🔍 Marke suchen …">
            <button class="filter-chip active" data-filter="all">Alle</button>
            <button class="filter-chip" data-filter="private">Nur Eigenmarken</button>
            <button class="filter-chip" data-filter="brand">Nur Hersteller</button>
        </div>
        <div class="brand-count" id="brandCount"></div>
        <div id="list" class="brand-list"></div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/marken.js"></script>
</body>
</html>
