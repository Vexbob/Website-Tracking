<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Statistik — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/statistics.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
<nav class="navbar">
    <a href="/ausgaben/" class="nav-title">← Statistik</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn" title="Design umschalten" aria-label="Design umschalten">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div id="subnav" data-active="statistik"></div>

    <div class="stat-filterbar">
        <div class="stat-preset-chips" id="statPresets">
            <button class="stat-chip" data-preset="7">7 Tage</button>
            <button class="stat-chip active" data-preset="30">30 Tage</button>
            <button class="stat-chip" data-preset="90">90 Tage</button>
            <button class="stat-chip" data-preset="365">12 Monate</button>
            <button class="stat-chip" data-preset="all">Alle</button>
        </div>
        <div class="stat-custom">
            <label>von <input type="date" id="statFrom"></label>
            <label>bis <input type="date" id="statTo"></label>
        </div>
    </div>

    <div class="stat-kpi-grid" id="statKpiGrid">
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
    </div>

    <div class="stat-insights" id="statInsights"></div>

    <div class="stat-card">
        <div class="stat-card-head">
            <h3>📈 Zeitverlauf <span id="statSeriesRange" class="stat-range-lbl"></span></h3>
            <div class="stat-mini-toggle" id="statGranularity">
                <button data-gran="daily" class="active">Tag</button>
                <button data-gran="weekly">Woche</button>
                <button data-gran="monthly">Monat</button>
            </div>
        </div>
        <div class="chart-wrap tall"><canvas id="chartSeries"></canvas></div>
    </div>

    <div class="split-2">
        <div class="stat-card">
            <h3>🥧 Nach Kategorie</h3>
            <div class="chart-wrap"><canvas id="chartCategory"></canvas></div>
            <div id="tableCategory"></div>
        </div>
        <div class="stat-card">
            <h3>🏪 Nach Laden</h3>
            <div class="chart-wrap"><canvas id="chartStore"></canvas></div>
            <div id="tableStore"></div>
        </div>
    </div>

    <div class="split-3-2">
        <div class="stat-card">
            <h3>📅 Ausgaben nach Wochentag</h3>
            <div class="chart-wrap"><canvas id="chartWeekday"></canvas></div>
        </div>
        <div class="stat-card">
            <h3>🏆 Top-Artikel</h3>
            <div id="tableItems" class="stat-scroll-y"></div>
        </div>
    </div>

    <div class="stat-card">
        <h3>🔥 365-Tage-Heatmap</h3>
        <div class="stat-heatmap" id="statHeatmap"></div>
        <div class="stat-heatmap-legend">
            <span>weniger</span>
            <div class="stat-hm-cell l1"></div>
            <div class="stat-hm-cell l2"></div>
            <div class="stat-hm-cell l3"></div>
            <div class="stat-hm-cell l4"></div>
            <span>mehr</span>
        </div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/statistik.js"></script>
</body>
</html>
