<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Statistik — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/statistics.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="/js/charts.js"></script>
<script src="/js/range-filter.js"></script>
</head>
<body>
<nav class="navbar">
    <a href="/ausgaben/" class="nav-title">← Statistik</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div id="subnav" data-active="statistik"></div>

    <!-- v1.60.0: Der Zeitraum liegt hinter einem Knopf (js/range-filter.js);
         vorher standen fünf Chips und zwei Datumsfelder dauerhaft im Weg. -->
    <div class="stat-filterbar">
        <span class="stat-filter-title">Zeitraum</span>
        <span class="stat-range-lbl" id="statRangeInfo"></span>
        <div class="stat-filter-slot" id="statRange"></div>
    </div>

    <div class="stat-kpi-grid" id="statKpiGrid">
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
        <div class="stat-kpi"><div class="stat-loading">Lade …</div></div>
    </div>

    <div class="stat-card">
        <div class="stat-card-head">
            <h3>📈 Zeitverlauf <span id="statSeriesRange" class="stat-range-lbl"></span></h3>
            <div class="stat-mini-toggle" id="statGranularity">
                <button data-gran="daily" class="active">Tag</button>
                <button data-gran="weekly">Woche</button>
                <button data-gran="monthly">Monat</button>
            </div>
        </div>
        <div class="chart-wrap tall"><canvas id="chartSeries"></canvas></div>
    </div>

    <div class="split-2">
        <div class="stat-card">
            <h3>🥧 Nach Kategorie</h3>
            <div class="chart-wrap"><canvas id="chartCategory"></canvas></div>
            <div id="tableCategory"></div>
        </div>
        <div class="stat-card">
            <h3>🏪 Nach Laden</h3>
            <div class="chart-wrap"><canvas id="chartStore"></canvas></div>
            <div id="tableStore"></div>
        </div>
    </div>

    <div class="split-3-2">
        <div class="stat-card">
            <h3>📅 Ausgaben nach Wochentag</h3>
            <div class="chart-wrap"><canvas id="chartWeekday"></canvas></div>
        </div>
        <div class="stat-card">
            <h3>🏆 Top-Artikel</h3>
            <div id="tableItems" class="stat-scroll-y"></div>
        </div>
    </div>

    <!-- Erkenntnisse stehen bewusst hier unten: sie sind Kommentar zu den
         Zahlen, nicht der Einstieg. Oben zwischen Kennzahlen und Zeitverlauf
         haben sie die Diagramme aus dem ersten Bildschirm gedrängt. -->
    <section class="stat-card" id="statInsightsCard" hidden>
        <h3>💡 Erkenntnisse</h3>
        <div class="stat-insights" id="statInsights"></div>
    </section>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/statistik.js"></script>
</body>
</html>
