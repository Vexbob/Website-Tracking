<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Statistik — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{visibility:hidden}body.ready{visibility:visible}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;box-shadow:var(--shadow-sm)}
.card h3{font-size:1rem;margin-bottom:0.75rem;font-weight:600}
.chart-wrap{position:relative;height:280px}
.chart-wrap.small{height:220px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:700px){.split{grid-template-columns:1fr}}
.hm-wrap{overflow-x:auto;padding-bottom:0.5rem}
.hm-grid{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:2px;min-width:min-content}
.hm-cell{border-radius:2px;background:var(--surface-2);cursor:default}
.hm-cell.l1{background:#c6f7d5}.hm-cell.l2{background:#7dd3a0}.hm-cell.l3{background:#22c55e}.hm-cell.l4{background:#16a34a}
:root[data-theme="dark"] .hm-cell{background:#22262f}
:root[data-theme="dark"] .hm-cell.l1{background:#14532d}
:root[data-theme="dark"] .hm-cell.l2{background:#166534}
:root[data-theme="dark"] .hm-cell.l3{background:#22c55e}
:root[data-theme="dark"] .hm-cell.l4{background:#4ade80}
.legend{display:flex;align-items:center;gap:4px;font-size:0.75rem;color:var(--text-faint);margin-top:0.5rem}
.legend-dots{display:flex;gap:2px}
.legend-dots .hm-cell{width:12px;height:12px}
.search-row{display:flex;gap:0.5rem;margin-bottom:0.75rem}
.search-row input{flex:1;margin:0}
.search-row button{width:auto;margin:0;padding:0.5rem 1rem;background:var(--teal);color:#fff}
.ph-item{display:grid;grid-template-columns:1fr auto auto;gap:0.75rem;padding:0.4375rem;border-bottom:1px solid var(--border);font-size:0.8125rem;align-items:center}
.ph-item:last-child{border-bottom:none}
.ph-name{font-weight:500}
.ph-meta{color:var(--text-muted);font-size:0.75rem}
.ph-price{font-weight:700;font-variant-numeric:tabular-nums}
.ausg-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--surface);padding:0.75rem 1.25rem;border-radius:10px;font-size:0.875rem;font-weight:500;z-index:1000;opacity:0;transition:transform .25s,opacity .25s;box-shadow:var(--shadow-lg);pointer-events:none}
.ausg-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<nav class="navbar">
    <a href="/ausgaben/" class="nav-title">← Statistik</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div class="card"><h3>Monatstrend (12 Monate)</h3><div class="chart-wrap"><canvas id="chartMonthly"></canvas></div></div>
    <div class="split">
        <div class="card"><h3>Nach Kategorie</h3><div class="chart-wrap small"><canvas id="chartCategory"></canvas></div></div>
        <div class="card"><h3>Nach Laden</h3><div class="chart-wrap small"><canvas id="chartStore"></canvas></div></div>
    </div>
    <div class="card">
        <h3>365-Tage Heatmap</h3>
        <div class="hm-wrap"><div id="heatmap" class="hm-grid"></div></div>
        <div class="legend">Weniger <div class="legend-dots"><div class="hm-cell"></div><div class="hm-cell l1"></div><div class="hm-cell l2"></div><div class="hm-cell l3"></div><div class="hm-cell l4"></div></div> Mehr</div>
    </div>
    <div class="card">
        <h3>💶 Preisverlauf für Artikel</h3>
        <div class="search-row">
            <input id="searchInput" placeholder="z.B. Milch, Brot, Kaffee …">
            <button id="searchBtn">Suchen</button>
        </div>
        <div id="phResults"></div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/statistik.js"></script>
</body>
</html>
