<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Statistik — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/statistics.css">
<link rel="stylesheet" href="/ausgaben/produkte.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/ikon.js"></script>
<script src="/js/reiter.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/js/bild.js"></script>
<script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" defer></script>
<script src="/js/charts.js"></script>
<script src="/js/range-filter.js"></script>
<link rel="stylesheet" href="/ausgaben/ausgaben.css">
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Statistik</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide az">
    <div id="subnav" data-active="statistik"></div>
    <script>renderSubnav();</script>

    <!-- v1.60.0: Der Zeitraum liegt hinter einem Knopf (js/range-filter.js);
         vorher standen fünf Chips und zwei Datumsfelder dauerhaft im Weg.
         Seit v1.64.0 gilt er für die ganze Seite, Produkte eingeschlossen. -->
    <div class="az-leiste">
        <span class="az-leiste-text" id="statRangeInfo"></span>
        <div id="statRange"></div>
    </div>

    <!-- v2.21.0: die Summe des Zeitraums als Heldenzahl auf der Bühne --
         derselbe Baustein wie auf der Übersicht. Kein Ring: für Ausgaben
         gibt es kein Ziel (DESIGN 7a). -->
    <section class="v-buehne az-buehne az-buehne--stat" id="statKpiGrid">
        <div class="az-b-haupt">
            <span class="v-buehne-marke">Ausgaben im Zeitraum</span>
            <strong class="v-held"><span class="skel az-held-skel"></span></strong>
            <div class="az-b-vergleich"><span class="skel az-skel-text"></span></div>
        </div>
        <dl class="az-b-fakten az-b-fakten--vier">
            <div><dt>&nbsp;</dt><dd><span class="skel az-skel-text" style="width:4rem"></span></dd></div>
            <div><dt>&nbsp;</dt><dd><span class="skel az-skel-text" style="width:4rem"></span></dd></div>
            <div><dt>&nbsp;</dt><dd><span class="skel az-skel-text" style="width:4rem"></span></dd></div>
            <div><dt>&nbsp;</dt><dd><span class="skel az-skel-text" style="width:4rem"></span></dd></div>
        </dl>
    </section>

    <div class="stat-card">
        <div class="stat-card-head">
            <h3>Zeitverlauf <span id="statSeriesRange" class="stat-range-lbl"></span></h3>
            <div class="stat-mini-toggle" id="statGranularity">
                <button data-gran="daily" class="active">Tag</button>
                <button data-gran="weekly">Woche</button>
                <button data-gran="monthly">Monat</button>
            </div>
        </div>
        <div class="chart-wrap tall" id="chartSeriesWrap"><canvas id="chartSeries"></canvas></div>
    </div>

    <!-- v2.42.0: Kategorien, Läden, Wochentage und Produkte stehen in eigenen
         Karten statt hinter einem Umschalter (DESIGN „Zeigen statt umschalten“,
         v1.93.0). Es bleiben vier Aufschlüsselungen DERSELBEN Summe über
         denselben Zeitraum oben -- nur sieht man sie jetzt nebeneinander. -->
    <div class="az-stat-raster">
        <section class="stat-card">
            <div class="stat-card-head">
                <h3>Kategorien</h3>
                <span class="stat-range-lbl" id="catNote"></span>
            </div>
            <div id="rankCategory" class="rank-list"></div>
        </section>
        <section class="stat-card">
            <div class="stat-card-head">
                <h3>Läden</h3>
                <span class="stat-range-lbl" id="storeNote"></span>
            </div>
            <div id="rankStore" class="rank-list"></div>
        </section>
    </div>

    <section class="stat-card">
        <div class="stat-card-head">
            <h3>Wochentage</h3>
            <span class="stat-range-lbl">Summe je Wochentag im Zeitraum</span>
        </div>
        <div class="chart-wrap"><canvas id="chartWeekday"></canvas></div>
    </section>

    <section class="stat-card" id="cardProdukte">
        <div class="stat-card-head">
            <h3>Produkte</h3>
            <span class="stat-range-lbl" id="prodSummary"></span>
        </div>
        <div class="bd-tools az-prod-tools">
            <select id="prodCategory" class="v-select" aria-label="Kategorie">
                <option value="">Alle Kategorien</option>
            </select>
            <select id="prodStore" class="v-select" aria-label="Laden">
                <option value="">Alle Läden</option>
            </select>
            <select id="prodSortWahl" class="v-select" aria-label="Sortieren">
                <option value="count">Am häufigsten gekauft</option>
                <option value="total_spent">Meiste Ausgaben</option>
                <option value="avg_price">Höchster Ø-Preis</option>
                <option value="last_date">Zuletzt gekauft</option>
                <option value="title">Name A–Z</option>
            </select>
        </div>
        <!-- Zusammenführen-Vorschläge: erscheint nur, wenn der Server
             Schreibvarianten desselben Artikels gefunden hat. -->
        <div id="mergeBox" class="merge-box" style="display:none"></div>
        <div id="prodListe"><span class="skel skel-block"></span></div>
        <button type="button" class="v-btn v-btn--ghost v-btn--sm az-prod-mehr" id="prodMehr" hidden>Mehr zeigen</button>
        <div class="az-prod-fuss">
            <button id="prodReparse" type="button" class="v-btn v-btn--ghost v-btn--sm"
                    title="Alle Bons mit Foto neu von der KI lesen lassen – aktualisiert Namen, Kategorien und Mengeneinheiten">Alle Bons neu lesen</button>
        </div>
    </section>

    <!-- Erkenntnisse stehen bewusst hier unten: sie sind Kommentar zu den
         Zahlen, nicht der Einstieg. Oben zwischen Kennzahlen und Zeitverlauf
         haben sie die Diagramme aus dem ersten Bildschirm gedrängt. -->
    <section class="stat-card" id="statInsightsCard" hidden>
        <h3>Erkenntnisse</h3>
        <div class="stat-insights" id="statInsights"></div>
    </section>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/produkte.js"></script>
<script src="/ausgaben/statistik.js"></script>
</body>
</html>
