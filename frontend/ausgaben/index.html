<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<meta name="description" content="Ausgaben verwalten: Kassenbons scannen, Analysen und Statistik.">
<title>Ausgaben — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/reiter.js"></script>
<script src="/js/ikon.js"></script>
<script src="/js/auswahl.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/js/bild.js"></script>
<script src="/js/range-filter.js"></script>
<script src="/ausgaben/ausgaben.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js" integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ" crossorigin="anonymous" defer></script>
<script src="/js/charts.js"></script>
<link rel="stylesheet" href="/ausgaben/ausgaben.css">
<link rel="stylesheet" href="/ausgaben/dashboard.css">
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Ausgaben</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide az">
    <!-- v2.21.0: Kopf und Bühne werden HIER gezeichnet, direkt an ihrer
         Stelle und vor dem ersten Bild (v2.17.0: kamen sie erst aus
         dashboard.js, rutschte am Handy alles darunter beim Laden). -->
    <div id="subnav" data-active="dashboard"></div>
    <script>renderSubnav();</script>
    <section class="v-buehne az-buehne" id="kpiGrid"></section>
    <script>zeichneKpis(null);</script>

    <!-- Erfassen: vier Wege, ein Bon hineinzukommen, in einer Zeile. Ziehen
         einer Bilddatei auf die Seite und Strg+V gehen weiter überall. -->
    <section class="nq-section" id="newQuick" aria-label="Neuer Bon">
        <div class="nq-grid">
            <button type="button" class="nq-tile" id="nqCamera">
                <span class="nq-badge" aria-hidden="true"><span data-ikon="kamera" data-ikon-gross="22"></span></span>
                <span class="nq-text"><span class="nq-title">Kamera</span><span class="nq-sub">Bon fotografieren</span></span>
            </button>
            <button type="button" class="nq-tile" id="nqGallery">
                <span class="nq-badge" aria-hidden="true"><span data-ikon="bild" data-ikon-gross="22"></span></span>
                <span class="nq-text"><span class="nq-title">Galerie</span><span class="nq-sub">Foto auswählen</span></span>
            </button>
            <button type="button" class="nq-tile" id="nqPaste">
                <span class="nq-badge" aria-hidden="true"><span data-ikon="ablage" data-ikon-gross="22"></span></span>
                <span class="nq-text"><span class="nq-title">Einfügen</span><span class="nq-sub"><kbd>Strg</kbd>+<kbd>V</kbd></span></span>
            </button>
            <a href="/ausgaben/neu.html#manual" class="nq-tile" id="nqManual">
                <span class="nq-badge" aria-hidden="true"><span data-ikon="stift" data-ikon-gross="22"></span></span>
                <span class="nq-text"><span class="nq-title">Manuell</span><span class="nq-sub">ohne Foto</span></span>
            </a>
        </div>
        <input type="file" id="nqFileCam" accept="image/*" capture="environment" hidden style="display:none">
        <input type="file" id="nqFileGal" accept="image/*" hidden style="display:none">
    </section>

    <section class="v-abschnitt az-liste">
        <header class="v-abschnitt-kopf">
            <h2>Bons</h2>
            <span class="v-abschnitt-sub" id="azListeSub"></span>
        </header>
        <!-- v1.38.0: Suche, Zeitraum und Filter in einer Zeile; Typ, Laden
             und Kategorie liegen im schwebenden Feld (DESIGN 6b). -->
        <div class="az-werkzeuge">
            <label class="az-suche">
                <span data-ikon="lupe" data-ikon-gross="17"></span>
                <input type="search" id="filterQ" placeholder="Laden, Artikel, Notiz" aria-label="Bons durchsuchen" autocomplete="off">
            </label>
            <div id="expRange"></div>
            <div class="filter-popover-wrap">
                <button type="button" id="filterToggle" class="filter-toggle-btn" aria-expanded="false" aria-haspopup="dialog" aria-controls="filterPopover">
                    <span data-ikon="filter" data-ikon-gross="16"></span>
                    <span>Filter</span>
                    <span class="filter-badge" id="filterBadge" hidden>0</span>
                </button>
                <div id="filterPopover" class="filter-popover" role="dialog" aria-label="Filter" hidden>
                    <div class="fp-row">
                        <label class="fp-label" for="filterType">Typ</label>
                        <!-- Optionen kommen aus /api/expense-types (eingebaute + eigene). -->
                        <select id="filterType">
                            <option value="">Alle Typen</option>
                        </select>
                    </div>
                    <div class="fp-row">
                        <label class="fp-label" for="filterStore">Laden</label>
                        <select id="filterStore"><option value="">Alle Läden</option></select>
                    </div>
                    <div class="fp-row">
                        <label class="fp-label" for="filterCategory">Kategorie</label>
                        <select id="filterCategory"><option value="">Alle Kategorien</option></select>
                    </div>
                    <div class="fp-actions">
                        <button type="button" id="filterReset" class="fp-btn fp-btn-ghost">Zurücksetzen</button>
                        <button type="button" id="filterApply" class="fp-btn fp-btn-primary">Fertig</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="activeFilterChips" class="active-filter-chips"></div>
        <div id="filterTotal"></div>
        <div id="expList" class="az-bons"><span class="skel az-skel-zeile"></span><span class="skel az-skel-zeile"></span><span class="skel az-skel-zeile"></span></div>
    </section>

    <section class="v-abschnitt" id="recurringCard" hidden>
        <header class="v-abschnitt-kopf">
            <h2>Wiederkehrend</h2>
            <span class="v-abschnitt-sub">erkannt aus den letzten Monaten</span>
        </header>
        <div id="recurringList"></div>
    </section>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/dashboard.js"></script>
</body>
</html>
