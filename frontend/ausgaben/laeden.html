<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Läden — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/ausgaben/ausgaben.js"></script>
<style>
body{visibility:hidden}body.ready{visibility:visible}
/* Karte mit farbigem Streifen — identisch zur Kategorie-Seite, damit beide
   Seiten sich wie dasselbe Modul anfühlen. */
.cat-card{position:relative;overflow:hidden}
.cat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat-color,var(--teal))}
.cat-card .entity-avatar{background:color-mix(in srgb, var(--cat-color, var(--teal)) 16%, transparent);color:var(--cat-color,var(--teal));box-shadow:none;font-size:1.1rem}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
    .cat-card .entity-avatar{background:var(--surface-2)}
}
.cat-card.is-unused .entity-title{color:var(--text-muted);font-weight:500}
.cat-bar{height:3px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.cat-bar span{display:block;height:100%;background:var(--cat-color,var(--teal));opacity:0.75}
.empty-note{padding:1.5rem 1rem;text-align:center;color:var(--text-muted);font-size:0.875rem;
    background:var(--surface-2);border:1px dashed var(--border);border-radius:var(--radius)}
.ausg-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--text);color:var(--surface);padding:0.75rem 1.25rem;border-radius:10px;font-size:0.875rem;font-weight:500;z-index:1000;opacity:0;transition:transform .25s,opacity .25s;box-shadow:var(--shadow-lg);pointer-events:none}
.ausg-toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.ausg-toast-success{background:var(--green-dark)}
.ausg-toast-error{background:var(--red-dark)}
</style>
</head>
<body>
<nav class="navbar">
    <a href="/ausgaben/" class="nav-title">← Läden</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn" title="Design umschalten" aria-label="Design umschalten">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main>
<div id="subnav" data-active="laeden"></div>

    <header class="page-head">
        <h1>Läden</h1>
        <p class="page-sub">Wo du einkaufst. Beim Scannen eines Bons legt Vexbob den erkannten Laden
        selbst an — hier gibst du ihm Icon und Farbe, die dann in Listen und Diagrammen auftauchen.</p>
    </header>

    <div class="toolbar">
        <input type="search" id="q" class="toolbar-search" placeholder="🔍 Laden suchen …" aria-label="Laden suchen">
        <select id="sort" aria-label="Sortierung">
            <option value="spent">Nach Ausgaben</option>
            <option value="count">Nach Einkäufen</option>
            <option value="name">Nach Name</option>
        </select>
        <button id="addBtn" class="btn btn-accent">+ Neuer Laden</button>
    </div>

    <div id="cleanup"></div>
    <p class="toolbar-count" id="count"></p>
    <div id="list" class="entity-grid"></div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/laeden.js"></script>
</body>
</html>
