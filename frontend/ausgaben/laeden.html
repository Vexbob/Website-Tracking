<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Läden — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
    <script src="/ausgaben/ausgaben.js"></script>
<style>
body{visibility:hidden}body.ready{visibility:visible}
/* Karte mit farbigem Streifen — identisch zur Kategorie-Seite, damit beide
   Seiten sich wie dasselbe Modul anfühlen. */
.cat-card{position:relative;overflow:hidden}
.cat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cat-color,var(--m-ausgaben))}
.cat-card .entity-avatar{background:color-mix(in srgb, var(--cat-color, var(--m-ausgaben)) 16%, transparent);color:var(--cat-color,var(--m-ausgaben));box-shadow:none;font-size:1.1rem}
@supports not (color: color-mix(in srgb, red 50%, blue)) {
    .cat-card .entity-avatar{background:var(--surface-2)}
}
.cat-card.is-unused .entity-title{color:var(--text-muted);font-weight:500}
.cat-bar{height:3px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.cat-bar span{display:block;height:100%;background:var(--cat-color,var(--m-ausgaben));opacity:0.75}

/* Vorschlaege zum Zusammenfuehren. Dieselbe ruhige Flaeche wie .cleanup-bar,
   aber mehrzeilig: die Namen sind die eigentliche Aussage. */
.mrg-box:empty{display:none}
.mrg-box{display:flex;flex-direction:column;gap:0.375rem;margin-bottom:0.875rem}
.mrg-row{display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;
    padding:0.625rem 0.875rem;background:var(--surface-2);
    border:1px solid var(--line);border-radius:var(--radius)}
.mrg-names{display:flex;align-items:center;gap:0.375rem;flex-wrap:wrap;flex:1;min-width:0}
.mrg-name{display:inline-flex;align-items:center;gap:0.3rem;font-size:0.8125rem;
    font-weight:600;color:var(--text-2)}
.mrg-name.is-keep{color:var(--text-1)}
.mrg-name i{font-style:normal;font-size:0.6875rem;color:var(--text-3);
    font-variant-numeric:tabular-nums}
.mrg-plus{color:var(--text-3);font-size:0.75rem}
.mrg-act{display:flex;gap:0.375rem;flex-wrap:wrap;margin-left:auto}
</style>
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Läden</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main>
<div id="subnav" data-active="laeden"></div>

    <header class="page-head">
        <h1>Läden</h1>
        <p class="page-sub">Wo du einkaufst. Beim Scannen eines Bons legt Vexbob den erkannten Laden
        selbst an — hier gibst du ihm Icon und Farbe, die dann in Listen und Diagrammen auftauchen.</p>
    </header>

    <div class="toolbar">
        <input type="search" id="q" class="toolbar-search" placeholder="🔍 Laden suchen …" aria-label="Laden suchen">
        <select id="sort" aria-label="Sortierung">
            <option value="spent">Nach Ausgaben</option>
            <option value="count">Nach Einkäufen</option>
            <option value="name">Nach Name</option>
        </select>
        <button id="addBtn" class="btn btn-accent">+ Neuer Laden</button>
    </div>

    <div id="merges" class="mrg-box"></div>
    <div id="cleanup"></div>
    <p class="toolbar-count" id="count"></p>
    <div id="list" class="entity-grid"></div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/laeden.js"></script>
</body>
</html>
