<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8f9fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<title>Produkte — Vexbob Ausgaben</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/ausgaben/statistik.css">
<link rel="stylesheet" href="/ausgaben/produkte.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<nav class="navbar">
    <a href="/" style="text-decoration:none;color:inherit;font-weight:700;font-size:1.125rem;">← Vexbob</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="themeBtn" title="Design umschalten">🌓</button>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div id="subnav" data-active="produkte"></div>

    <div class="stat-card">
        <div class="stat-card-head">
            <h3>🛒 Produkt-Statistik</h3>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <select id="prodPeriod" class="stat-chip" style="border-radius:6px;padding:0.375rem 0.5rem">
                    <option value="30">30 Tage</option>
                    <option value="90" selected>90 Tage</option>
                    <option value="180">180 Tage</option>
                    <option value="365">1 Jahr</option>
                    <option value="0">Alle</option>
                </select>
                <select id="prodCategory" class="stat-chip" style="border-radius:6px;padding:0.375rem 0.5rem">
                    <option value="">Alle Kategorien</option>
                </select>
                <select id="prodStore" class="stat-chip" style="border-radius:6px;padding:0.375rem 0.5rem">
                    <option value="">Alle Läden</option>
                </select>
            </div>
        </div>

        <div class="stat-kpi-grid" id="prodKpis">
            <div class="stat-kpi"><div class="stat-kpi-label">Produkte</div><div class="stat-kpi-value" id="kpiCount">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Gesamt ausgegeben</div><div class="stat-kpi-value" id="kpiTotal">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Ø Preis</div><div class="stat-kpi-value" id="kpiAvg">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Käufe gesamt</div><div class="stat-kpi-value" id="kpiBuys">–</div></div>
        </div>

        <div style="overflow-x:auto">
            <table class="stat-table" id="prodTable">
                <thead>
                    <tr>
                        <th>Produkt</th>
                        <th>Kategorie</th>
                        <th>Laden</th>
                        <th style="text-align:right">Käufe</th>
                        <th style="text-align:right">Gesamt</th>
                        <th style="text-align:right">Ø Preis</th>
                        <th style="text-align:right">Letzter Kauf</th>
                    </tr>
                </thead>
                <tbody id="prodBody">
                    <tr><td colspan="7" class="stat-empty">Lade …</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/ausgaben.js"></script>
<script src="/ausgaben/produkte.js"></script>
</body>
</html>
