<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Produkte — Vexbob Ausgaben</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/statistics.css">
<link rel="stylesheet" href="/ausgaben/produkte.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/sw-update.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<script src="/js/charts.js"></script>
<script src="/js/range-filter.js"></script>
</head>
<body>
<nav class="navbar">
    <a href="/" class="nav-title">← Produkte</a>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide">
    <div id="subnav" data-active="produkte"></div>

    <!-- Zusammenfuehren-Vorschlaege: erscheint nur, wenn der Server Schreib-
         varianten desselben Artikels gefunden hat ("Gouda" / "Gouda jung"). -->
    <div id="mergeBox" class="merge-box" style="display:none"></div>

    <div class="stat-card">
        <div class="stat-card-head">
            <h3>🛒 Produkt-Statistik</h3>
            <div style="display:flex;gap:0.5rem;flex-wrap:wrap">
                <!-- v1.60.2: derselbe Zeitraum-Knopf wie in Statistik und
                     Gesundheit — inklusive eigenem Von/Bis-Zeitraum, den das
                     Auswahlfeld hier nie konnte. -->
                <div id="prodRange"></div>
                <select id="prodCategory" class="v-select">
                    <option value="">Alle Kategorien</option>
                </select>
                <select id="prodStore" class="v-select">
                    <option value="">Alle Läden</option>
                </select>
                <button id="prodReparse" class="prod-reparse-btn"
                        title="Alle Bons mit Foto neu von der KI parsen — aktualisiert Namen, Kategorien und Mengeneinheiten">🔄 Alle neu parsen</button>
            </div>
        </div>

        <div class="stat-kpi-grid" id="prodKpis">
            <div class="stat-kpi"><div class="stat-kpi-label">Produkte</div><div class="stat-kpi-value" id="kpiCount">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Gesamt ausgegeben</div><div class="stat-kpi-value" id="kpiTotal">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Ø Preis</div><div class="stat-kpi-value" id="kpiAvg">–</div></div>
            <div class="stat-kpi"><div class="stat-kpi-label">Käufe gesamt</div><div class="stat-kpi-value" id="kpiBuys">–</div></div>
        </div>

        <div style="overflow-x:auto">
            <table class="stat-table" id="prodTable">
                <!-- v1.62.0: sortierbar. Auf einer Seite, deren Frage "was kostet
                     mich am meisten" ist, war eine feste Reihenfolge nach
                     Kaufhäufigkeit die falsche Antwort. -->
                <thead>
                    <tr id="prodHead">
                        <th class="sort" data-sort="title">Produkt</th>
                        <th class="sort" data-sort="category_name">Kategorie</th>
                        <th>Läden</th>
                        <th class="sort num" data-sort="count">Käufe</th>
                        <th class="sort num" data-sort="total_spent">Gesamt</th>
                        <th class="sort num" data-sort="avg_price">Ø Preis</th>
                        <th class="sort num" data-sort="last_date">Letzter Kauf</th>
                    </tr>
                </thead>
                <tbody id="prodBody">
                    <tr><td colspan="7" class="stat-empty">Lade …</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/ausgaben.js"></script>
<script src="/ausgaben/produkte.js"></script>
</body>
</html>
