<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Bon — Vexbob</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
<script src="/js/config.js"></script>
<script src="/js/version.js"></script>
<script src="/js/api.js"></script>
<script src="/js/nav-switcher.js"></script>
<script src="/js/modal.js"></script>
<script src="/js/reiter.js"></script>
<script src="/js/ikon.js"></script>
<script src="/js/auswahl.js"></script>
<script src="/js/sw-update.js"></script>
<script src="/js/bild.js"></script>
<script src="/ausgaben/ausgaben.js"></script>
<link rel="stylesheet" href="/ausgaben/ausgaben.css">
<style>body{visibility:hidden}body.ready{visibility:visible}</style>
</head>
<body>
<nav class="navbar">
    <span class="nav-title">Bon</span>
    <div class="nav-right">
        <span class="nav-btn" id="userLabel" style="cursor:default"></span>
        <button class="nav-btn" id="logoutBtn">Logout</button>
    </div>
</nav>
<main class="wide az">
    <div id="subnav" data-active="bon"></div>
    <script>renderSubnav();</script>
    <!-- v2.21.0: Der Bon ist ein Kassenzettel, kein Formular. Ändern und die
         Positionen stehen je in einem Dialog (DESIGN 6d): angesehen wird ein
         Bon viel öfter, als er geändert wird. -->
    <div class="az-bon-raster">
        <div id="content"><span class="skel az-bon-skel"></span></div>
        <aside class="az-bon-seite" id="azBonSeite" hidden>
            <div class="az-bon-aktionen">
                <button type="button" class="v-btn v-btn--primary" id="eEdit"><span data-ikon="stift" data-ikon-gross="16"></span>Bearbeiten</button>
                <button type="button" class="v-btn" id="ePositionen"><span data-ikon="etikett" data-ikon-gross="16"></span>Positionen</button>
            </div>
            <div id="azBonFoto"></div>
        </aside>
    </div>
</main>
<div class="version-tag"></div>
<script src="/ausgaben/bon.js"></script>
</body>
</html>
